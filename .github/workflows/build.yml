name: Build PSMS
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build release APKs
        run: gradle assembleBazaarRelease assembleDirectRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PSMS-Bazaar-APK
          path: app/build/outputs/apk/bazaar/release/app-bazaar-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PSMS-Direct-APK
          path: app/build/outputs/apk/direct/release/app-direct-release.apk
